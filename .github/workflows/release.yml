name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the bundle and attaches dist/hass-cards.js,
# which is the file HACS downloads (dist/ isn't committed).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Attach bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/hass-cards.js --clobber
