name: Release

# Pushing a tag vX.Y.Z builds the bundle and creates the GitHub release with dist/hass-cards.js attached in
# one step, so a release never exists without the file HACS downloads (dist/ isn't committed). The tagged
# commit must already have passed CI; this workflow doesn't test again.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}" >&2
            exit 1
          fi
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow CI --commit "${GITHUB_SHA}" \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [ "${conclusion}" = "0" ]; then
            echo "CI hasn't passed on ${GITHUB_SHA}; wait for it, then delete and push the tag again" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Create the release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/hass-cards.js --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
