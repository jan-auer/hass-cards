name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Playwright's image has WebKit and its system libraries preinstalled, so the render tests need no install
    # step. Keep its tag in sync with the playwright version in package.json (the first step checks it).
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Image matches package.json's playwright
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          if [ "${version}" != "1.65.1" ]; then
            echo "playwright is ${version} but the CI image is v1.65.1: update the container tag in ci.yml" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
